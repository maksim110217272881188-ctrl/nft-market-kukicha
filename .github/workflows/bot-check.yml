
name: Bot Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check bot files
        run: |
          echo "Checking Telegram bot files..."
          test -f bot.py
          test -f requirements.txt
          echo "Bot files found!"
